name: miniledger
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miniledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniledger_local}
      POSTGRES_DB: ${POSTGRES_DB:-miniledger}
    ports: ['127.0.0.1:${DB_PORT:-5432}:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: { context: ., target: api }
    environment: &api-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-miniledger}:${POSTGRES_PASSWORD:-miniledger_local}@db:5432/${POSTGRES_DB:-miniledger}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env first}
      OTP_SECRET: ${OTP_SECRET:?Copy .env.example to .env first}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
    depends_on:
      db: { condition: service_healthy }
    command: ['node', 'apps/api/dist/db/migrate.js']
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  api:
    build: { context: ., target: api }
    environment: *api-env
    ports: ['${API_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
  web:
    build:
      context: .
      target: web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000/api}
    ports: ['${WEB_PORT:-8080}:8080']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
volumes:
  postgres_data:
