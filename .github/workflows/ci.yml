name: MiniLedger CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: miniledger
          POSTGRES_PASSWORD: miniledger_test
          POSTGRES_DB: miniledger_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U miniledger -d miniledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://miniledger:miniledger_test@localhost:5433/miniledger_test
      - run: cp .env.example .env && docker compose up --build -d --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
      - run: docker compose down
        if: always()
